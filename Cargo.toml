[package]
name = "wutong-server"
description = "Wutong Server: optional self-hosted headless node (sync relay, federation gateway, service host, agent worker)"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/project-wutong/wutong-server"

[dependencies]
wutong-core = { git = "https://github.com/project-wutong/wutong-core", branch = "main" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
